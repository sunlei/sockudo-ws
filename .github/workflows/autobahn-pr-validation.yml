name: Autobahn PR validation
on:
  push:
    branches: [sunlei/autobahn-pr-validation]
permissions:
  contents: read
jobs:
  conformance:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: [{"case": "pr-20", "sha": "dadaad903c4abfc2869da9d0a967adffd4e1312b"}, {"case": "pr-21", "sha": "915e83a9ad912963f762f40c7934553db7043230"}, {"case": "pr-23", "sha": "62eda5ea46b8b97102f00331528fb6c09b793181"}, {"case": "pr-26", "sha": "116499d1607825f35912a96c95a9d4615429988f"}, {"case": "pr-28", "sha": "ae2c47e48f018c766b2ba891374671646edf9ca0"}, {"case": "pr-30", "sha": "cd6b43c9f9ddcfb53560bcbd31c45f647ef126de"}, {"case": "pr-32", "sha": "0fa8b48dc1652cf5eedce6a75305f4b366b81c6b"}, {"case": "pr-33", "sha": "8ae2e74d25621a71898110af7d4cde7621cca925"}, {"case": "pr-34", "sha": "16482d5bb6b7902ef444ba17efb66cef9b4d53d0"}, {"case": "pr-35", "sha": "f70f30891dcd2eec458a18cc529c9bee2424256b"}, {"case": "pr-36", "sha": "4178e695529edaeede0076153eee21de0c8458c4"}, {"case": "pr-37", "sha": "e88c4ccb9f2215abd375039cb75e19eaa7e8a489"}, {"case": "pr-38", "sha": "babb334a67af4da37deda6ddebc8a70a812e1ef5"}, {"case": "pr-40", "sha": "7b24cb47fa49ba943657978f19c684c977c79b98"}, {"case": "pr-43", "sha": "41af790181f10741b2dbdf85c58955eec1ac1b23"}, {"case": "pr-44", "sha": "039cb1b47d95f81d0634cc175de5e71abc65fc57"}, {"case": "pr-45", "sha": "dd94f905fb31cab5cb557701d03189656c59aec7"}, {"case": "pr-46", "sha": "931e54bb49e82d52a0c2c3309375d8f6f63893ae"}, {"case": "pr-47", "sha": "2848525afc07edc0c55de0d89837272aa17f131a"}, {"case": "pr-48", "sha": "044ed90d42c4fa9bb1a96f79c9c0c335e05a0972"}, {"case": "pr-51", "sha": "5b19c3c0f1608a097efa4ee58ad56c265a587a3c"}, {"case": "pr-52", "sha": "eabd06574a1c11235e3facda3e3ffa858e715f17"}, {"case": "pr-55", "sha": "fdc9f226f4843cb592005d21f15f833a3f5836a7"}, {"case": "pr-58", "sha": "b4d9e793f27a414c5d0392a394cd2c503a93ebc7"}, {"case": "pr-68", "sha": "49534dd2baeb9aa7b108b89278c81d7e99748839"}, {"case": "pr-69", "sha": "a0029f8ff7473518d19693cfcaa7533b05fe970e"}]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sunlei/sockudo-ws
          ref: ${{ matrix.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protocol echo server
        run: |
          cargo build --release --bin autobahn-server --features permessage-deflate
          mkdir -p autobahn-validation
          cp Cargo.lock autobahn-validation/Cargo.lock
          rustc -Vv > autobahn-validation/toolchain.txt
          sha256sum target/release/autobahn-server > autobahn-validation/binary.sha256
      - name: Run complete Autobahn suite
        env:
          CASE: ${{ matrix.case }}
          REVISION: ${{ matrix.sha }}
        run: |
          mkdir -p autobahn-validation/reports
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path("autobahn-validation")
          root.joinpath("config.json").write_text(json.dumps({
              "outdir": "/reports",
              "servers": [{"agent": os.environ["CASE"] + "-" + os.environ["REVISION"][:12], "url": "ws://127.0.0.1:9001"}],
              "cases": ["*"], "exclude-cases": [], "exclude-agent-cases": {}
          }))
          root.joinpath("revision.txt").write_text(os.environ["REVISION"] + "\n")
          PYTHON
          ./target/release/autobahn-server > autobahn-validation/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYTHON'
          import socket, time
          for attempt in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 9001), timeout=1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("echo server did not become ready")
          PYTHON
          set +e
          docker run --name autobahn-suite --network host -e PYTHONUNBUFFERED=1 \
            -v "$PWD/autobahn-validation:/config:ro" \
            -v "$PWD/autobahn-validation/reports:/reports" \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest -m fuzzingclient -s /config/config.json > autobahn-validation/suite.log 2>&1
          suite_status=$?
          set -e
          docker inspect autobahn-suite > autobahn-validation/container-state.json
          exit "$suite_status"
      - name: Classify report results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import collections, json, os
          from pathlib import Path
          report = Path("autobahn-validation/reports/index.json")
          if not report.exists():
              raise SystemExit("Autobahn report missing; no passing result")
          data = json.loads(report.read_text())
          acceptable = {"OK", "NON-STRICT", "INFORMATIONAL"}
          failures = []
          summary = []
          for agent, cases in data.items():
              behaviors = collections.Counter(row.get("behavior", "MISSING") for row in cases.values())
              closes = collections.Counter(row.get("behaviorClose", "MISSING") for row in cases.values())
              summary.append(f"{agent}: {len(cases)} cases; behavior={dict(behaviors)}; close={dict(closes)}")
              for number, row in cases.items():
                  if row.get("behavior") not in acceptable or row.get("behaviorClose") not in acceptable:
                      failures.append((agent, number, row.get("behavior"), row.get("behaviorClose")))
          text = "\n".join(summary) + "\n\nUnexpected or unimplemented results: " + repr(failures) + "\n"
          print(text)
          Path("autobahn-validation/summary.txt").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(text)
          if not data or failures:
              raise SystemExit(1)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-${{ matrix.case }}-${{ matrix.sha }}
          path: autobahn-validation/
