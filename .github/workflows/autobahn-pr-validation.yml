name: Autobahn PR validation
on:
  push:
    branches: [sunlei/autobahn-pr-validation]
permissions:
  contents: read
jobs:
  conformance:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: [{"case": "pr-46", "sha": "931e54bb49e82d52a0c2c3309375d8f6f63893ae"}, {"case": "pr-55", "sha": "fdc9f226f4843cb592005d21f15f833a3f5836a7"}, {"case": "pr-59", "sha": "e34db1390b368bcf61605e8353c66dad38e3a9db"}, {"case": "pr-60", "sha": "0f67c36bcfb39bb2bb9bbd5e91a5c496d124c856"}, {"case": "pr-61", "sha": "1016b9929f3be5a55bb1872ff4bb760685106754"}, {"case": "pr-64", "sha": "64ba83c9e4b4ee3e1e0e7d69d96b5051ba682a92"}, {"case": "pr-65", "sha": "28ecf31821ecaa86b179ba77e7692134be29c6c9"}, {"case": "pr-66", "sha": "3cdf731d70d88be6be54e4825675e3222202f74a"}, {"case": "pr-67", "sha": "78ea90ffbe2fe4d1015a6c3e46d484bfbd9a38a3"}]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sunlei/sockudo-ws
          ref: ${{ matrix.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protocol echo server
        run: |
          cargo build --release --bin autobahn-server --features permessage-deflate
          mkdir -p autobahn-validation
          cp Cargo.lock autobahn-validation/Cargo.lock
          rustc -Vv > autobahn-validation/toolchain.txt
          sha256sum target/release/autobahn-server > autobahn-validation/binary.sha256
      - name: Run complete Autobahn suite
        env:
          CASE: ${{ matrix.case }}
          REVISION: ${{ matrix.sha }}
        run: |
          mkdir -p autobahn-validation/reports
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path("autobahn-validation")
          # The pinned image's full catalog has 517 cases. Restart the Python 2
          # process between families after a complete run was OOM-killed.
          groups = {"1": 16, "2": 11, "3": 7, "4": 10, "5": 20, "6": 145,
                    "7": 37, "9": 54, "10": 1, "12": 90,
                    **{f"13.{part}": 18 for part in range(1, 8)}}
          root.joinpath("groups.json").write_text(json.dumps(groups))
          root.joinpath("groups.txt").write_text("\n".join(groups) + "\n")
          for group in groups:
              root.joinpath("reports", group).mkdir(parents=True, exist_ok=True)
              root.joinpath(f"config-{group}.json").write_text(json.dumps({
                  "outdir": "/reports",
                  "servers": [{"agent": os.environ["CASE"] + "-" + os.environ["REVISION"][:12], "url": "ws://127.0.0.1:9001"}],
                  "cases": [group + ".*"], "exclude-cases": [], "exclude-agent-cases": {}
              }))
          root.joinpath("revision.txt").write_text(os.environ["REVISION"] + "\n")
          PYTHON
          ./target/release/autobahn-server > autobahn-validation/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYTHON'
          import socket, time
          for attempt in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 9001), timeout=1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("echo server did not become ready")
          PYTHON
          suite_status=0
          while IFS= read -r group; do
            set +e
            docker run --name "autobahn-suite-$group" --network host -e PYTHONUNBUFFERED=1 \
              -v "$PWD/autobahn-validation:/config:ro" \
              -v "$PWD/autobahn-validation/reports/$group:/reports" \
              crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
              wstest -m fuzzingclient -s "/config/config-$group.json" > "autobahn-validation/suite-$group.log" 2>&1
            group_status=$?
            set -e
            docker inspect "autobahn-suite-$group" > "autobahn-validation/container-state-$group.json"
            if (( group_status != 0 )); then
              suite_status=$group_status
            fi
          done < autobahn-validation/groups.txt
          exit "$suite_status"
      - name: Classify report results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import collections, json, os
          from pathlib import Path
          root = Path("autobahn-validation")
          groups = json.loads(root.joinpath("groups.json").read_text())
          acceptable = {"OK", "NON-STRICT", "INFORMATIONAL"}
          failures = []
          summary = []
          seen = set()
          for group, expected in groups.items():
              report = root.joinpath("reports", group, "index.json")
              if not report.exists():
                  failures.append((group, "missing report"))
                  continue
              data = json.loads(report.read_text())
              if len(data) != 1:
                  failures.append((group, "expected exactly one agent"))
              for agent, cases in data.items():
                  if len(cases) != expected or seen.intersection(cases):
                      failures.append((group, "incomplete or duplicated case coverage"))
                  seen.update(cases)
                  behaviors = collections.Counter(row.get("behavior", "MISSING") for row in cases.values())
                  closes = collections.Counter(row.get("behaviorClose", "MISSING") for row in cases.values())
                  summary.append(f"{agent} group {group}: {len(cases)} cases; behavior={dict(behaviors)}; close={dict(closes)}")
                  for number, row in cases.items():
                      if row.get("behavior") not in acceptable or row.get("behaviorClose") not in acceptable:
                          failures.append((agent, number, row.get("behavior"), row.get("behaviorClose")))
          if len(seen) != 517:
              failures.append(("total", f"expected 517 unique cases, got {len(seen)}"))
          text = "\n".join(summary) + "\n\nUnexpected or unimplemented results: " + repr(failures) + "\n"
          print(text)
          Path("autobahn-validation/summary.txt").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(text)
          if failures:
              raise SystemExit(1)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-${{ matrix.case }}-${{ matrix.sha }}
          path: autobahn-validation/
